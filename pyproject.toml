[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppulse"
version = "0.1.0"
description = "Plateforme data & IA ShopPulse (Olist)"
authors = [{ name = "Matteo Bruno" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
pipeline = ["prefect>=2.16"]
nlp = ["torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "ipykernel>=6.29",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shoppulse --cov-report=term-missing --cov-fail-under=50"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
